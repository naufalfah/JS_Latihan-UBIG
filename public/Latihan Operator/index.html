<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Operator</title>
</head>
<body>
    <h1>Latihan Operator Eps 16</h1>
    <p>Aritmatika</p>
    <input type="number" name="aritmatika1" id="aritmatika1">  
    <br><br>
    <select name="" id="operatorAritmatika">
        <option selected>Pilih Operator</option>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="/">/</option>
        <option value="*">*</option>
        <option value="%">%</option>
    </select>
    <br><br>
    <input type="number" name="aritmatika2" id="aritmatika2">
    <br><br>
    <button type="submit" id="aritmatikaBtn">Hasil</button>
    <br><br>
    <span id="aritmatikaHasil"></span>

    <br><br>
    <p>Logika</p>
    <input type="text" name="boolean1" id="boolean1">  
    <br><br>
    <select name="" id="operatorLogika">
        <option selected>Pilih Operator</option>
        <option value="||">Or</option>
        <option value="&&">And</option>
    </select>
    <br><br>
    <input type="text" name="boolean2" id="boolean2">
    <br><br>
    <button type="submit" id="logikaBtn">Hasil</button>
    <br><br>
    <span id="logikaHasil"></span>

    <script src="script.js"></script>
</body>
</html>
